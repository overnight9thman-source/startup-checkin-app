<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <meta name="description" content="创业规划打卡APP，用30秒记录今天有没有行动。">
  <title>创业规划执行打卡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="app-name">创业规划打卡APP</p>
      <h1>创业规划执行打卡</h1>
      <p id="todayDate" class="today-date"></p>
    </header>

    <section class="score-panel" aria-live="polite">
      <div>
        <span class="score-label">今日得分</span>
        <strong id="scoreValue">0</strong>
      </div>
      <div id="statusBadge" class="status-badge status-danger">危险状态</div>
    </section>

    <form id="checkinForm" class="checkin-form">
      <section class="question">
        <h2>今天是否发布内容</h2>
        <div class="choice-row" role="group" aria-label="今天是否发布内容">
          <label><input type="radio" name="postedContent" value="yes"><span>是</span></label>
          <label><input type="radio" name="postedContent" value="no" checked><span>否</span></label>
        </div>
      </section>

      <section class="question">
        <h2>今天是否增加业务资产</h2>
        <div class="choice-row" role="group" aria-label="今天是否增加业务资产">
          <label><input type="radio" name="addedAsset" value="yes"><span>是</span></label>
          <label><input type="radio" name="addedAsset" value="no" checked><span>否</span></label>
        </div>
      </section>

      <section class="question">
        <h2>今天是否开发客户</h2>
        <div class="choice-row" role="group" aria-label="今天是否开发客户">
          <label><input type="radio" name="developedClient" value="yes"><span>是</span></label>
          <label><input type="radio" name="developedClient" value="no" checked><span>否</span></label>
        </div>
      </section>

      <section class="question">
        <h2>今天刷短视频多久</h2>
        <div class="choice-column" role="group" aria-label="今天刷短视频多久">
          <label><input type="radio" name="shortVideoTime" value="under30" checked><span>少于30分钟</span></label>
          <label><input type="radio" name="shortVideoTime" value="30to60"><span>30-60分钟</span></label>
          <label><input type="radio" name="shortVideoTime" value="over60"><span>超过60分钟</span></label>
        </div>
      </section>

      <section class="question">
        <h2>今天是否运动</h2>
        <div class="choice-row" role="group" aria-label="今天是否运动">
          <label><input type="radio" name="exercised" value="yes"><span>是</span></label>
          <label><input type="radio" name="exercised" value="no" checked><span>否</span></label>
        </div>
      </section>

      <section class="question">
        <h2>今天是否产生可见成果</h2>
        <div class="choice-row" role="group" aria-label="今天是否产生可见成果">
          <label><input type="radio" name="visibleResult" value="yes"><span>是</span></label>
          <label><input type="radio" name="visibleResult" value="no" checked><span>否</span></label>
        </div>
      </section>

      <button class="primary-button" type="submit">保存今日打卡</button>
      <p id="saveMessage" class="save-message" aria-live="polite"></p>
    </form>

    <section class="history-section">
      <div class="section-title">
        <h2>最近7天记录</h2>
        <button id="clearButton" class="text-button" type="button">清空记录</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <footer class="app-footer">只记录行动，不记录幻想。</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
